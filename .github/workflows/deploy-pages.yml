name: Deploy GitHub Pages demo

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/greencare-web/package-lock.json
      - name: Install Vue dependencies
        run: npm ci
        working-directory: src/greencare-web
      - name: Test Vue demo
        run: npm test
        working-directory: src/greencare-web
      - name: Build Vue demo
        run: npm run build:pages
        working-directory: src/greencare-web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/greencare-web/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
