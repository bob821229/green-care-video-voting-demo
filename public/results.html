<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="短片票選正式結果。">
  <title>票選結果｜短片票選</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=mirrored-flower-1">
</head>
<body>
  <header class="result-hero" id="top">
    <nav class="nav" aria-label="主要導覽">
      <a class="brand" href="./" aria-label="綠色照顧－回到首頁"><img class="brand-logo" src="images/logo.png" alt="綠色照顧"></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="resultMenu" aria-label="開啟選單">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="nav-menu" id="resultMenu">
        <a href="./#works">參賽作品</a>
        <a href="./#rules">投票辦法</a>
        <a class="current" href="results.html" aria-current="page">票選結果</a>
      </div>
    </nav>
    <div class="result-hero-inner">
      <p class="eyebrow"><span>短影音競賽</span><i aria-hidden="true">・</i><strong>網路人氣票選</strong></p>
      <h1><span>綠照</span><em>好</em><span>時光</span></h1>
      <p class="result-title-subtitle">網路人氣票選結果</p>
      <div class="result-summary">
        <p id="resultLead">正在讀取票選結果。</p>
        <p id="resultPeriod"></p>
      </div>
    </div>
  </header>

  <main class="results-main">
    <div id="previewNotice" class="preview-notice" hidden>
      <strong>即時排名</strong>
      <span>即時排名非最終結果，以主辦單位公告為準。</span>
    </div>
    <section id="resultsUnavailable" class="results-unavailable" hidden>
      <p class="eyebrow">結果尚未公布</p>
      <h2>謝謝你的參與</h2>
      <p id="unavailableMessage">正式結果將於投票截止並完成票數確認後公布。</p>
      <a class="primary-link" href="./">返回投票首頁</a>
    </section>

    <section id="resultsContent" class="final-results" hidden>
      <div class="final-results-heading">
        <h2 id="resultsPageHeading">票選結果</h2>
        <p>僅統計有效票；每 30 秒更新<br>最後更新：<time id="resultsUpdated">讀取中</time></p>
      </div>
      <div class="final-results-columns">
        <section class="final-group final-group-individual" aria-labelledby="individualResultTitle">
          <h3 id="individualResultTitle" class="visually-hidden">個人組票選結果</h3>
          <div id="individualWinner"></div>
          <div class="final-ranking-table">
            <div class="final-ranking-head" aria-hidden="true"><span>名次</span><span>作品</span><span>票數</span></div>
            <ol id="individualRanking"></ol>
          </div>
        </section>
        <section class="final-group final-group-team" aria-labelledby="teamResultTitle">
          <h3 id="teamResultTitle" class="visually-hidden">團體組票選結果</h3>
          <div id="teamWinner"></div>
          <div class="final-ranking-table">
            <div class="final-ranking-head" aria-hidden="true"><span>名次</span><span>作品</span><span>票數</span></div>
            <ol id="teamRanking"></ol>
          </div>
        </section>
      </div>
    </section>
  </main>

  <a class="back-to-top" href="#top" aria-label="回到頁面頂端">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
  </a>
  <footer class="site-footer">
    <div class="footer-item footer-organization"><span>主辦單位</span><img src="images/主辦單位.png" alt="農業部農村發展及水土保持署"></div>
    <div class="footer-item footer-organization"><span>執行單位</span><img src="images/執行單位.png" alt="台灣水資源與農業研究院"></div>
    <p class="footer-copyright">Copyright © 2026 All Rights Reserved.</p>
  </footer>
  <script src="site-config.js?v=winner-poster-fit-1"></script>
  <script src="nav.js?v=true-top-1"></script>
  <script src="api-client.js?v=watch-progress-2"></script>
  <script type="module" src="results.js?v=winner-poster-fit-1"></script>
</body>
</html>
